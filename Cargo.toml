[package]
name = "aeg-maia"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A thin generic module-system core"

[features]
default = ["net"]
net = []

[[bin]]
name = "aeg-maia"
path = "src/bin/aeg_maia.rs"
required-features = ["net"]

[dependencies]
mio = { version = "1", features = ["os-poll", "net"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[profile.release]
panic = "abort"
